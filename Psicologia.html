<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa Interactivo Psicología</title>

<style>

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #fff, #fff);
  color: white;
  text-align: center;
}

h1 {
  margin: 15px;
}

/* CONTENEDOR */
#map-container {
  width: 90%;
  max-width: 900px;
  margin: auto;
  overflow: hidden;
  border-radius: 12px;
}

#mapa {
  position: relative;
  transition: transform 0.5s ease;
}

#mapa img {
  width: 100%;
}

/* MARCADORES */
#markers {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.marker {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #f72a2a;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: 0.2s;
}

.marker:hover {
  transform: translate(-50%, -50%) scale(1.5);
}

/* PANEL */
#panel {
  margin: 20px auto;
  width: 85%;
  max-width: 700px;
  background: rgb(0, 0, 0);
  padding: 20px;
  border-radius: 12px;
  backdrop-filter: blur(10px);
  animation: fade 0.3s ease;
}

@keyframes fade {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}

.autor {
  background: #2563eb;
  margin: 6px;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.autor:hover {
  background: #1d4ed8;
}

.card img {
  width: 120px;
  border-radius: 10px;
  margin-bottom: 10px;
}

button {
  margin-top: 10px;
  padding: 8px 15px;
  border: none;
  border-radius: 6px;
  background: #2563eb;
  cursor: pointer;
}

</style>
</head>

<body>

<h1>Mapa Interactivo - Psicología</h1>

<div id="map-container">
  <div id="mapa">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg">
    <div id="markers"></div>
  </div>
</div>

<div id="panel">
Seleccioná un marcador
</div>

<script>

/* COORDENADAS REALES */
const coords = {
  usa: { lat: 37, lon: -95 },
  reino_unido: { lat: 42, lon: -10 },
  francia: { lat: 35, lon: -6 },
  alemania: { lat: 40, lon: 2 },
  austria: { lat: 35, lon: 5 },
  suiza: { lat: 35, lon: 0 },
  rusia: { lat: 60, lon: 90 },
  grecia: { lat: 27, lon: 15  }
};

/* CONVERTIR LAT/LON → PIXELES */
function convertir(lat, lon, ancho, alto) {
  const x = (lon + 180) * (ancho / 360);
  const y = (90 - lat) * (alto / 180);
  return { x, y };
}

/* CREAR MARCADORES */
function crearMarkers() {
  const mapa = document.getElementById("mapa");
  const cont = document.getElementById("markers");

  const ancho = mapa.offsetWidth;
  const alto = mapa.offsetHeight;

  cont.innerHTML = "";

  for (let pais in coords) {
    const { x, y } = convertir(coords[pais].lat, coords[pais].lon, ancho, alto);

    const div = document.createElement("div");
    div.className = "marker";
    div.style.left = x + "px";
    div.style.top = y + "px";

    div.onclick = () => seleccionar(pais, div);

    cont.appendChild(div);
  }
}

/* ZOOM */
const mapa = document.getElementById("mapa");

function seleccionar(pais, el) {
  zoom(el);
  mostrarPais(pais);
}

function zoom(el) {
  const mapaRect = mapa.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();

  const scale = 2;

  const offsetX = (elRect.left + elRect.width/2) - (mapaRect.left + mapaRect.width/2);
  const offsetY = (elRect.top + elRect.height/2) - (mapaRect.top + mapaRect.height/2);

  mapa.style.transition = "transform 0.6s ease";

  mapa.style.transform = `
    translate(${-offsetX}px, ${-offsetY}px)
    scale(${scale})
  `;
}

function resetZoom() {
  mapa.style.transform = "translate(0,0) scale(1)";
}

/* UI */
function mostrarPais(p) {
  let html = "<h2>Autores</h2>";
  data[p].forEach((a,i)=>{
    html += `<div class="autor" onclick="mostrarAutor('${p}',${i})">${a.nombre}</div>`;
  });
  panel.innerHTML = html;
}

function mostrarAutor(p,i) {
  let a = data[p][i];
  panel.innerHTML = `
    <div class="card">
      <img src="${a.img}" onerror="this.src='https://via.placeholder.com/120'">
      <h2>${a.nombre}</h2>
      <p>${a.info}</p>
      <button onclick="mostrarPais('${p}')">Volver</button>
      <br>
      <button onclick="resetZoom()">Volver al mapa</button>
    </div>
  `;
}

/* INIT */
window.onload = crearMarkers;
window.onresize = crearMarkers;
